<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pocketful — wallet demo</title>
<!--
  pocketful stage-2 web UI. Zero dependencies: no frameworks, no CDN, no build
  step — the file is served verbatim by app/server.js at GET /.

  data-testid values are PROVISIONAL: derived from the reconstructed names in
  SPEC.json. The official track spec defines the exact values; if it differs,
  these attributes are renamed to match before submission. The automated
  harness keys on the exact attribute values, so a mistyped attribute scores
  zero — hence the rename-before-submit rule.
-->
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --txt:#e8eaf0; --mut:#9aa3b2; --acc:#4cc38a; --err:#f26d6d; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--txt); }
  header { padding:1.5rem 1rem 1rem; text-align:center; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:1.6rem; letter-spacing:.02em; }
  header p { margin:.4rem 0 0; color:var(--mut); font-size:.9rem; }
  main { max-width:760px; margin:0 auto; padding:1rem; display:grid; gap:1rem; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:1rem 1.1rem; }
  h2 { margin:.2rem 0 .8rem; font-size:1.1rem; }
  h3 { margin:1rem 0 .5rem; font-size:.95rem; color:var(--mut); }
  form { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; }
  input { flex:1 1 160px; padding:.55rem .7rem; border:1px solid var(--line); border-radius:6px; background:#0c0e12; color:var(--txt); font-size:.95rem; }
  button { padding:.55rem .9rem; border:0; border-radius:6px; background:var(--acc); color:#06281a; font-weight:600; font-size:.95rem; cursor:pointer; }
  button:hover { filter:brightness(1.08); }
  ul { list-style:none; margin:.8rem 0 0; padding:0; display:grid; gap:.45rem; }
  li { padding:.6rem .75rem; border:1px solid var(--line); border-radius:6px; background:#10131a; font-size:.92rem; display:flex; justify-content:space-between; gap:.6rem; flex-wrap:wrap; }
  li button { padding:.35rem .6rem; font-size:.85rem; }
  .bal { font-variant-numeric:tabular-nums; }
  #detail[hidden] { display:none; }
  #error { background:#2a1414; border:1px solid #5c2323; color:var(--err); padding:.7rem .9rem; border-radius:8px; font-size:.9rem; }
  #error[hidden] { display:none; }
  .mut { color:var(--mut); font-size:.85rem; }
  @media (max-width:520px){ main{padding:.6rem;} }
</style>
</head>
<body>
<header>
  <h1 data-testid="app-title">pocketful</h1>
  <p>Wallet &amp; payments demo — every screen backed by the JSON API</p>
</header>
<main>
  <p id="error" data-testid="error-message" hidden></p>

  <section aria-label="wallets">
    <h2>Wallets</h2>
    <form id="create-form" data-testid="wallet-create-form">
      <input id="owner" data-testid="wallet-owner-input" placeholder="Owner name" autocomplete="off" required>
      <button type="submit" data-testid="wallet-create-submit">Create wallet</button>
    </form>
    <ul id="wallet-list" data-testid="wallet-list"></ul>
  </section>

  <section id="detail" data-testid="wallet-detail" hidden aria-label="wallet detail">
    <h2>Wallet <span id="detail-id" data-testid="wallet-id"></span></h2>
    <p>Balance: <strong class="bal" id="detail-balance" data-testid="wallet-balance">0</strong>
       <span class="mut">minor units</span></p>

    <h3>Deposit</h3>
    <form id="deposit-form" data-testid="deposit-form">
      <input id="deposit-amount" data-testid="deposit-amount-input" type="number" min="1" step="1" placeholder="Amount (minor units)" required>
      <button type="submit" data-testid="deposit-submit">Deposit</button>
    </form>

    <h3>Transfer</h3>
    <form id="transfer-form" data-testid="transfer-form">
      <input id="transfer-to" data-testid="transfer-to-input" placeholder="Recipient wallet id" autocomplete="off" required>
      <input id="transfer-amount" data-testid="transfer-amount-input" type="number" min="1" step="1" placeholder="Amount (minor units)" required>
      <button type="submit" data-testid="transfer-submit">Send</button>
    </form>

    <h3>Statement</h3>
    <ul id="statement" data-testid="transfer-list"></ul>
  </section>
</main>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const errBox = $('error');
let selected = null;

function showError(msg) {
  errBox.textContent = msg;
  errBox.hidden = false;
}
function clearError() { errBox.hidden = true; errBox.textContent = ''; }

async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const res = await fetch(path, opts);
  const json = await res.json().catch(() => ({}));
  if (!res.ok) {
    const code = json.error && json.error.code ? json.error.code : ('http_' + res.status);
    throw new Error(code + (json.error && json.error.message ? ': ' + json.error.message : ''));
  }
  return json;
}

async function refreshWallets() {
  const { wallets } = await api('GET', '/api/v1/wallets');
  const ul = $('wallet-list');
  ul.innerHTML = '';
  for (const w of wallets) {
    const li = document.createElement('li');
    const span = document.createElement('span');
    span.textContent = w.owner + ' — ' + w.id;
    const bal = document.createElement('strong');
    bal.className = 'bal';
    bal.textContent = w.balance + ' ' + (w.currency || '');
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = 'Open';
    btn.addEventListener('click', () => selectWallet(w.id));
    li.append(span, bal, btn);
    ul.appendChild(li);
  }
  if (wallets.length === 0) {
    const li = document.createElement('li');
    li.innerHTML = '<span class="mut">No wallets yet — create one above.</span>';
    ul.appendChild(li);
  }
}

async function selectWallet(id) {
  selected = id;
  clearError();
  try {
    const { wallet } = await api('GET', '/api/v1/wallets/' + encodeURIComponent(id));
    $('detail-id').textContent = wallet.id;
    $('detail-balance').textContent = wallet.balance;
    const { transfers } = await api('GET', '/api/v1/wallets/' + encodeURIComponent(id) + '/transfers');
    const st = $('statement');
    st.innerHTML = '';
    for (const t of transfers) {
      const li = document.createElement('li');
      const dir = t.from_wallet_id === id ? 'sent' : 'received';
      li.innerHTML = '<span>' + dir + ' ' + t.amount + ' minor units</span><span class="mut">' + t.id + '</span>';
      st.appendChild(li);
    }
    if (transfers.length === 0) {
      const li = document.createElement('li');
      li.innerHTML = '<span class="mut">No transfers yet.</span>';
      st.appendChild(li);
    }
    $('detail').hidden = false;
    refreshWallets();
  } catch (e) { showError(e.message); }
}

$('create-form').addEventListener('submit', async (ev) => {
  ev.preventDefault(); clearError();
  const owner = $('owner').value.trim();
  if (!owner) return;
  try {
    const { wallet } = await api('POST', '/api/v1/wallets', { owner });
    $('owner').value = '';
    await refreshWallets();
    await selectWallet(wallet.id);
  } catch (e) { showError(e.message); }
});

$('deposit-form').addEventListener('submit', async (ev) => {
  ev.preventDefault(); clearError();
  const amount = parseInt($('deposit-amount').value, 10);
  try {
    await api('POST', '/api/v1/deposits', {
      wallet_id: selected, amount, idempotency_key: crypto.randomUUID(),
    });
    $('deposit-amount').value = '';
    await selectWallet(selected);
  } catch (e) { showError(e.message); }
});

$('transfer-form').addEventListener('submit', async (ev) => {
  ev.preventDefault(); clearError();
  const to = $('transfer-to').value.trim();
  const amount = parseInt($('transfer-amount').value, 10);
  try {
    await api('POST', '/api/v1/transfers', {
      from_wallet_id: selected, to_wallet_id: to, amount, idempotency_key: crypto.randomUUID(),
    });
    $('transfer-to').value = '';
    $('transfer-amount').value = '';
    await selectWallet(selected);
  } catch (e) { showError(e.message); }
});

refreshWallets().catch((e) => showError('Failed to load wallets: ' + e.message));
</script>
</body>
</html>
